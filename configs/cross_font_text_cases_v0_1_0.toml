# Milestone M8B committed matched text-case manifest, version 0.1.0.
#
# These are the thirty matched text cases of the planned cross-font
# generalization benchmark. The same thirty cases are rendered in all ten
# pinned typefaces, which is what makes the design matched rather than
# merely parallel.
#
# The manifest is frozen evidence, not a runtime input: the generator
# reads the stored strings verbatim and never samples text at runtime. The
# stored strings are pure ASCII, so their UTF-8 encoding is unambiguous.
#
# Normalisation is explicit and is never applied silently. The policy is
# 'none': the stored string is used exactly as written. The verifier
# asserts that the stored string is already NFC, NFD, NFKC and NFKD
# normalised and that it contains only characters of the project charset,
# and it raises rather than rewriting a string that would need
# normalisation.
#
# Glyph coverage is proven, not assumed. Every character of the project
# charset is present in the character map of all ten pinned faces, so no
# case can be rendered with a substituted glyph or a question mark. The
# verifier re-derives this from the pinned font files on every run and
# fails closed if a face is missing a character.
#
# The derivation below records where the cases came from. It is
# provenance, not a runtime instruction: the committed rows are the
# authority, and the verifier re-derives them to prove the manifest
# still matches the rule.

[manifest]
name = "cross-font-matched-text-cases"
version = "v0.1.0"
milestone = "M8B"
status = "frozen"
n_cases = 30
seed = 20260821
case_namespace = "matched_case"
render_namespace = "render"
variant_namespace = "variant"
charset = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"
text_lengths = [4, 5, 6]
text_length_weights = [0.3, 0.4, 0.3]
encoding = "utf-8"
normalization = "none"
normalization_policy = "The stored string is used verbatim. No runtime normalisation is applied. The verifier asserts that the stored string is already NFC, NFD, NFKC and NFKD normalised, is pure ASCII, and contains only characters of the project charset, and it raises rather than rewriting a string that would need normalisation."
case_id_format = "case-{index:03d}"
canonical_serialization = "json.dumps(payload, sort_keys=True, separators=(',', ':'), allow_nan=False) encoded as UTF-8"
case_hash_algorithm = "sha256"
manifest_hash_algorithm = "sha256"
manifest_hash_scope = "The SHA-256 digest of the canonical JSON list of the thirty canonical case records, in the order they appear in this file. The digest therefore pins the content and the ordering. The digest is pinned by the execution protocol, not stored here, so it is not self-referential."
derivation = "For case index i in 0..29 the generator draws, from a single numpy generator seeded with derive_noise_seed(dataset_seed, 'matched_case', str(i)): first the text length from the configured length distribution, then the text itself from the project charset. The per-font render seed is derived separately with derive_noise_seed(dataset_seed, 'render', font_key, str(i)), so a change to the render jitter can never change a text case."
selection_constraints = ["The text is drawn only from the project charset 23456789ABCDEFGHJKMNPQRSTUVWXYZ, which omits the visually ambiguous characters 0, O, 1, I, 5 and S is retained only where the frozen M7B charset admits it.", "The text length is drawn from the frozen M7B length distribution of 4, 5 or 6 characters with weights 0.3, 0.4 and 0.3.", "The thirty cases are unique as strings and their case identifiers are unique.", "Every character of every case is present in the character map of all ten pinned faces.", "The cases are synthetic CAPTCHA-like labels for a synthetic image pipeline. They are not sampled from real CAPTCHA traffic, they carry no information about human difficulty, and no claim about solvability or security is made or implied."]
case_record_fields = ["case_id", "case_index", "normalization", "text", "text_length", "text_sha256", "text_utf8_hex"]

[glyph_coverage]
method = "The character map of each pinned font file is read with fontTools (fontTools.ttLib.TTFont.getBestCmap) and compared with the codepoints of the project charset."
faces_checked = 10
charset_codepoints_checked = 31
result = "All ten pinned faces declare a character map that contains every codepoint of the project charset, so all thirty cases are renderable by every face without a substituted glyph."
failure_behaviour = "A face that is missing a required character, a font file whose SHA-256 differs from the pinned value and a font file that is absent are all hard failures. The generator never substitutes a glyph and never replaces a character with a question mark."

