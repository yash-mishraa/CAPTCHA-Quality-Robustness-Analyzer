# Milestone 2 pilot configuration: end-to-end dataset pipeline smoke run.
#
# This configuration deliberately mirrors the Milestone 1 rendering condition
# (white background, text length 5, vertical jitter only) so the pipeline can be
# validated before the larger dataset is generated. It is a separate experiment
# definition: configs/pilot_target_validation.toml is never edited.
#
# The diagnostic thresholds below are predeclared decision aids, not gates on
# the milestone; see docs/METHODOLOGY.md section 4.4.

[dataset]
name = "captcha-quality"
version = "v0.1.0-pilot"
seed = 20261020
output_dir = "data/processed/captcha_quality_v0.1.0-pilot"
sources_per_font = 3
text_lengths = [5]
text_length_weights = [1.0]
charset = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"

[render]
canvas_width = 192
canvas_height = 64
fit_fraction = 0.86
vertical_padding = 0.10
jitter_fraction = 0.05
spacing_jitter_fraction = 0.0
placement_jitter_fraction = 0.0
background_mode = "white"
background_min = 255
background_max = 255
center_ink = true
strict_bounds = true

[fonts]
keys = ["arial", "courier_new", "times_new_roman"]
min_required = 3

[families]
names = ["gaussian_blur", "gaussian_noise"]

[families.gaussian_blur]
unit = "px"
levels = [0.0, 1.0, 2.0, 3.5, 5.0]

[families.gaussian_noise]
unit = "sigma"
levels = [0.0, 6.0, 12.0, 20.0, 32.0]

[splits]
train = 0.56
val = 0.22
test = 0.22
seed = 20261021
min_sources_per_split = 2
stratify_by_font = true

[diagnostics]
trivial_single_feature_r2 = 0.90
strong_confound_r2 = 0.70
min_group_rows = 20
