# Milestone M7D evaluation-design and dataset-expansion plan.
#
# This is a read-only research-planning milestone. It does not generate a
# dataset, render images, train, refit, recalibrate, select or tune a model,
# change predictions, or modify any frozen benchmark artifact. Every proposed
# dataset, benchmark, endpoint and success criterion is planned, not executed.
#
# The selected direction is A: a broader unseen-font benchmark with a matched
# text-case control. The matching control addresses the unmatched
# familiar-versus-held-out comparison identified by M7C; it does not turn the
# roster of ten typefaces into a random sample of a font population.
#
# Scope: synthetic SSIM against an exact source-specific clean reference.
# Nothing in this plan measures human readability, CAPTCHA solve rates,
# security or production robustness.

[run]
name = "evaluation-design-plan"
version = "v0.1.0"
seed = 20261111
output_reports = "reports/evaluation_design_plan_v0_1_0"

[plan]
milestone = "M7D"
chosen_direction = "A"
status = "planned_not_executed"
primary_question = "How does the frozen M5C champion's synthetic SSIM error vary across a pre-specified broader roster of held-out fonts when text case and corruption realisations are matched?"
n_text_cases = 30
rows_per_source = 21
primary_rows_per_source = 19
diagnostic_rows_per_source = 2
dataset_version = "matched-font-v0.1.0"
dataset_output = "data/processed/matched_font_benchmark_v0.1.0"
benchmark_report_output = "reports/matched_font_benchmark_v0_1_0"
renderer = "Pillow ImageDraw + FreeType"
canvas_width = 192
canvas_height = 64
image_mode = "L"
image_format = "PNG"
text_lengths = [4, 5, 6]
text_length_weights = [0.30, 0.40, 0.30]
primary_scope = "all_primary"
primary_metric = "rmse"
source_group = "matched_text_case"
bootstrap_method = "matched_case_grouped_percentile"
n_bootstrap = 2000
confidence_level = 0.95
near_degenerate_sd = 0.005

# The planned corruption protocol is the frozen M7B protocol, repeated with
# matched seeds across fonts within a text case. Clean and 0.5 px elastic rows
# are diagnostic only. The 0.5 px rung remains below the predeclared
# near-degeneracy margin and cannot support primary ranking claims.
[[corruptions]]
family = "clean"
unit = "identity"
role = "diagnostic"
levels = [0.0]

[[corruptions]]
family = "gaussian_blur"
unit = "px"
role = "primary"
levels = [1.0, 2.0, 3.5, 5.0]

[[corruptions]]
family = "gaussian_noise"
unit = "sigma"
role = "primary"
levels = [6.0, 12.0, 20.0, 32.0]

[[corruptions]]
family = "thin_lines"
unit = "count"
role = "primary"
levels = [1.0, 2.0, 4.0, 7.0]

[[corruptions]]
family = "arc_strokes"
unit = "count"
role = "primary"
levels = [1.0, 2.0, 4.0, 7.0]

[[corruptions]]
family = "elastic"
unit = "px"
role = "primary"
levels = [1.0, 2.0, 3.0]

[[corruptions]]
family = "elastic"
unit = "px"
role = "diagnostic"
levels = [0.5]

[precision]
text_case_counts = [20, 30, 40, 60]
paired_sd_assumptions = [0.005, 0.010, 0.020]
font_counts = [6, 8, 10, 12, 16]
font_sd_assumptions = [0.010, 0.020, 0.030]
interval_multiplier = 1.96

# Candidate roster selected before any model outcome is inspected. The three
# familiar fonts are the frozen M3 development fonts. The seven held-out fonts
# are absent from M3, which is the only font set the champion was ever
# developed on. Georgia, Monaco and Impact were used once in M7B as an
# *evaluation* set (never for fitting, calibration or selection), so reusing
# them keeps three of the seven directly comparable with M7B and adds four
# genuinely new faces: Verdana, Trebuchet MS, Chalkduster and Luminari. The
# roster is purposive and spans serif, monospace, sans and display/script
# typography; it is not a random sample of fonts.
#
# Paths and hashes are verified on the current development machine. Presence on
# this machine is not a guarantee of availability or licensing elsewhere.
# Dataset generation must fail closed if any required file is missing, changes
# hash, loses glyph coverage or lacks an approved local-use status. Font files
# are never redistributed by this project.
[[planned_fonts]]
key = "arial"
role = "familiar"
family = "Arial"
stratum = "grotesque_sans"
