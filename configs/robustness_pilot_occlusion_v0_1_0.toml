# Milestone 4A pilot: occlusion and visual-interference feasibility.
#
# This is a pilot only. It reads the frozen Milestone 2 dataset (v0.1.0) and
# never modifies it, its split, the Milestone 3 benchmark reports or the saved
# models. Outputs go to a separate, Git-ignored pilot dataset and report tree.
#
# Scope: synthetic image similarity (SSIM against the clean reference), not
# human readability, CAPTCHA solvability, or real-world generalisation.

[pilot]
name = "occlusion-interference-pilot"
version = "v0.1.0"
seed = 20261023
bootstrap_replicates = 1000
output_dataset = "data/processed/occlusion_interference_pilot_v0.1.0"
output_reports = "reports/robustness_pilot"

# Pinned to the actual frozen artifacts. The runner verifies every hash and
# re-renders every clean source from configs/dataset_v0_1_0.toml before using it.
[reference]
dataset = "data/processed/captcha_quality_v0.1.0"
config = "configs/dataset_v0_1_0.toml"
dataset_version = "v0.1.0"
generation_config_hash = "820cce7a77b5e95761f033b75e8cb2b304b6ad6293f67b5bc27bcf0823a6cef9"
manifest_sha256 = "a6a2cb8654eb51055e11e4aec6dbc94c2a59a6fdf8ba6b4946135bffc8b4cf37"
sources_sha256 = "07d50255cdc82ea77087fc64b398d62db49f96156eea9cf5aee59bc070ab5a37"
features_sha256 = "d3715e7975cf41c41e49fa2338ca4e961a7a59981318be19149c78e89804d798"
ground_truth_sha256 = "7a09a01a802f104b86cf69ce686a176c1cf3c98b6369c7e4578d870e4f768eea"
summary_sha256 = "3f03e10e94c19de2747b3ae355b32fa044de658cf1bc8ad0e90f8f57e9a96787"
split_assignment_sha256 = "70c07d171d2e2b3032db86ce8c2942f1ca5dd1c3c01bbcd30a0fac0d7dda7232"

# Severities are 1-based. The four levels use a shared nested stroke pool per
# source and variant: severity k draws the first k strokes, and every severity is
# rendered from the same clean reference.
[interference]
variants = ["thin_lines", "arc_strokes"]
stroke_width_px = 1
stroke_intensity = 0

[interference.thin_lines]
stroke_counts = [1, 2, 4, 7]
line_angle_deg_min = -60.0
line_angle_deg_max = 60.0

[interference.arc_strokes]
stroke_counts = [1, 2, 4, 7]
arc_sweep_deg_min = 120.0
arc_sweep_deg_max = 240.0
arc_radius_fraction_min = 0.20
arc_radius_fraction_max = 0.55
arc_aspect_ratio_min = 0.50
arc_aspect_ratio_max = 1.50

# Predeclared feasibility gate. These thresholds are fixed before generation.
# The feature contrast is evaluated at the highest severity (7 strokes) against
# the frozen blur and noise families at the same severity. Cohen's d is
# (pilot mean - reference mean) / pooled SD.
[gate]
ssim_std_min = 0.02
level_mean_range_min = 0.10
per_level_sd_min = 0.005
median_source_spearman_max = -0.80
increasing_step_fraction_max = 0.15
feature_effect_min = 0.50
feature_strong_effect_min = 0.80
feature_strong_effect_count_min = 2
duplicate_fraction_max = 0.0
