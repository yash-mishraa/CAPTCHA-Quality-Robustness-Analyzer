# Milestone M7C cross-font evaluation analysis.
#
# M7C is a read-only analysis of the frozen M7B held-out-font predictions and
# the frozen M5C familiar-font predictions. It does not generate a dataset,
# train, refit, recalibrate, select or tune a model, change a target, change a
# split, or write into any prior dataset/model/report directory.
#
# The independent unit is a source group. Every bootstrap replicate resamples
# whole source groups and keeps all rows belonging to a sampled source together.
# The three held-out fonts are a purposive sample, not a sample of font
# identities. Font-level differences are descriptive for the observed sources
# and do not identify a font-population effect.
#
# Scope: SSIM against an exact synthetic clean reference. Nothing here measures
# human readability, CAPTCHA solve rates, security or production robustness.

[run]
name = "cross-font-analysis"
version = "v0.1.0"
seed = 20261110
n_bootstrap = 2000
confidence_level = 0.95
output_reports = "reports/cross_font_analysis_v0_1_0"

[analysis]
group_column = "source_id"
independent_unit = "source_id"
bootstrap_method = "source_grouped_percentile"
near_degenerate_sd = 0.005
font_ids = ["georgia", "monaco", "impact"]
family_order = ["clean", "gaussian_blur", "gaussian_noise", "thin_lines", "arc_strokes", "elastic"]
primary_scopes = [
  "all_primary",
  "original_blur_noise",
  "gaussian_blur",
  "gaussian_noise",
  "interference",
  "thin_lines",
  "arc_strokes",
  "geometric_primary",
  "geometric_primary_1px",
  "geometric_primary_2px",
  "geometric_primary_3px",
]
diagnostic_scopes = ["clean_reference", "diagnostic_0_5px"]
geometric_amplitudes_primary_px = [1.0, 2.0, 3.0]
geometric_amplitude_diagnostic_px = 0.5
paired_contrasts = [
  "gaussian_noise_minus_gaussian_blur",
  "thin_lines_minus_arc_strokes",
  "interference_minus_original_blur_noise",
  "geometric_primary_minus_original_blur_noise",
  "geometric_2px_minus_1px",
  "geometric_3px_minus_2px",
  "geometric_3px_minus_1px",
]
font_difference_scopes = [
  "all_primary",
  "original_blur_noise",
  "gaussian_blur",
  "gaussian_noise",
  "interference",
  "thin_lines",
  "arc_strokes",
  "geometric_primary",
  "geometric_primary_1px",
  "geometric_primary_2px",
  "geometric_primary_3px",
  "clean_reference",
  "diagnostic_0_5px",
]
familiar_comparison_scopes = [
  "original_blur_noise",
  "gaussian_blur",
  "gaussian_noise",
  "geometric_primary",
  "geometric_primary_1px",
  "geometric_primary_2px",
  "geometric_primary_3px",
  "clean_reference",
  "diagnostic_0_5px",
]
top_k_sources = 3
# Predeclared classification rules. They are descriptive evidence rules, not
# significance tests. No threshold is changed after seeing M7C results.
font_difference_rule = "any_pairwise_primary_rmse_ci_excludes_zero"
blur_noise_consistency_rule = "all_font_rmse_above_familiar_point"
geometric_concealment_rule = "severity_rmse_range_ratio_ge_1_5"
concentration_rule = "top3_share_ge_0_25_and_effective_fraction_le_0_5"

# Every input is read-only and pinned by SHA-256. The paths and hashes were
# recorded from the clean M7B commit 6631df5. A missing file, changed byte or
# unknown schema is a hard failure; M7C never falls back to a looser schema.
[[inputs]]
key = "m7b_config"
path = "configs/heldout_font_benchmark_v0_1_0.toml"
sha256 = "5eb97fc6bc0ed1e7c2b17a9e8cc6f53ab89e529d17496a800e9b6c0b73a041ee"
