# M9A read-only interference error analysis, version 0.1.0.
#
# This configuration authorises exactly one new report directory. It does not
# authorise benchmark generation, model loading, fitting, calibration,
# selection, feature construction or any write to an M8C/M8D/M8E artifact.

schema = "m9a-interference-error-analysis-config-v1"

[run]
name = "interference-error-analysis"
version = "v0.1.0"
seed = 20261022
n_bootstrap = 2000
confidence_level = 0.95
output_reports = "reports/interference_error_analysis_v0_1_0"

[analysis]
near_degenerate_sd = 0.005
large_error_threshold = 0.20
group_column = "source_id"
independent_unit = "source group (one font rendered with one committed text case)"
bootstrap_method = "source-grouped percentile bootstrap; whole source groups resampled with replacement"
feature_association_method = "Spearman rank correlation"
multiple_comparison_method = "Benjamini-Hochberg q-values; exploratory, not source-clustered inferential tests"
large_error_rule = "|ssim_target - prediction| >= 0.20 in absolute SSIM units; predeclared exploratory threshold"
feature_association_rule = "descriptive rank association only; no feature selection or causal interpretation"
font_contrast_rule = "paired by text case: one font's source MAE minus the mean source MAE of the other nine fonts on the same case"
source_characteristic_rule = "descriptive source-level Spearman association; font and case composition remain confounded"

[[inputs]]
key = "predictions"
path = "reports/matched_font_benchmark_v0_1_0/predictions.csv"
sha256 = "e6c1f1ba83bbb05c18fed8a9b0dd1c87014a6f6c3667475971b2834dfedd4dd4"
rows = 6300
role = "frozen M8C predictions, targets and benchmark labels"

[[inputs]]
key = "manifest"
path = "data/processed/matched_font_benchmark_v0.1.0/manifest.csv"
sha256 = "35ae405fd084070bf4d6c235638cbda6671573389e880dcca2a63d8b66049743"
rows = 6300
role = "frozen M8C sample, source, corruption and protocol manifest"

[[inputs]]
key = "features"
path = "data/processed/matched_font_benchmark_v0.1.0/features.csv"
sha256 = "fa2d79c85d682b26545dc2c4e3ec5ece2a41d85aea7e1ea1070f7256ff8519bb"
rows = 6300
role = "existing frozen eight-feature table; no feature is added"

