# Milestone M8E benchmark integrity contract, version 0.1.0.
#
# This is a new, explicitly versioned maintenance contract around the already
# completed M8C benchmark. It creates nothing, regenerates nothing, and does not
# replace the historical M8C protocol or lifecycle protocol.
#
# Two modes are deliberately distinguished:
#
# * historical-evidence mode verifies the recorded M8C ground truth, input
#   manifest, run metadata and complete in-repository execution closure. It does
#   not claim that the historical run used a clean tree. M8C honestly recorded
#   revision 75c8ef4-dirty.
# * future-execution mode requires a clean, committed working tree and absent
#   output paths before any action runs. It also rejects every duplicate input
#   manifest key; the historical text_case_manifest multiplicity is allowed only
#   in historical-evidence mode and only under the explicit rule below.
#
# The expected ground-truth SHA-256 is copied from the recorded M8C run
# metadata (and independently reported by M8D). It is never recomputed from the
# current file during verification. The expected module hashes are the exact
# file bytes of the complete execution import closure discovered from the M8C
# execution module. The file set is explicit, so an unrelated file added to a
# shared directory does not invalidate the contract.

schema = "m8e-integrity-config-v1"
contract = "m8e-integrity-v1"

[benchmark]
name = "matched-font-benchmark"
dataset = "data/processed/matched_font_benchmark_v0.1.0"
report = "reports/matched_font_benchmark_v0_1_0"
protocol = "configs/cross_font_benchmark_protocol_v0_2_0.toml"
protocol_sha256 = "059388572f264fb2332f3427da774f1ab30f1339a27f19fd3e98e98163d4574c"
lifecycle = "configs/benchmark_lifecycle_v0_3_0.toml"
lifecycle_sha256 = "3339dc64472b1510cb297d9af0884bb9d3b79e1bf0a8e978f04b72cd64ece83d"
run_metadata = "reports/matched_font_benchmark_v0_1_0/run_metadata.json"
run_metadata_sha256 = "930ce8d8767a3e52919e5736ff8a9dfe4b74b008c54e2cc2107fd221d0944ebd"
root_module = "src/captcha_quality/matched_font_benchmark.py"
historical_execution_revision = "75c8ef4-dirty"

[ground_truth]
path = "data/processed/matched_font_benchmark_v0.1.0/ground_truth.csv"
sha256 = "426fa41949223ebc481e88b0c42a22770df80d30d3ed8f951fa0f52b92b39dfd"
rows = 300
columns = ["source_id", "case_id", "font_id", "text"]
unique_columns = ["source_id"]
regular_file = true

[input_manifest]
path = "reports/matched_font_benchmark_v0_1_0/input_manifest.csv"
sha256 = "70f8b0ca8dfc2a9c6742858f8f0bfa3b863ca78fb9a4aacf4bac0a17952d3d71"
rows = 36
unique_keys = 35
key_column = "key"
columns = ["key", "path", "sha256", "expected_sha256", "matches", "role", "kind"]

# The historical M8C manifest contains two rows for text_case_manifest. They
# name the same file, record the same observed and expected hash, agree on the
# match flag and kind, and differ only in descriptive role prose. This is a
# duplicate record, not an ambiguous resource identity. The historical file is
# preserved byte-for-byte; future manifests must have unique keys.
[[input_manifest.legacy_duplicates]]
key = "text_case_manifest"
count = 2
identical_columns = ["path", "sha256", "expected_sha256", "matches", "kind"]
reason = "historical M8C construction emitted one lifecycle pin and one explicit protocol pin for the same committed text-case manifest; preserving the historical bytes, rejecting the pattern for future runs"

[repository]
require_clean_worktree = true
require_committed_revision = true
require_absent_outputs = true

[environment]
python_version = "3.13.16"
python_implementation = "CPython"
system = "Darwin"
machine = "arm64"

[[environment.packages]]
name = "fonttools"
version = "4.67.0"
modules = ["fontTools"]

[[environment.packages]]
name = "joblib"
version = "1.6.0"
modules = ["joblib"]

[[environment.packages]]
name = "numpy"
version = "2.5.4"
modules = ["numpy"]

[[environment.packages]]
name = "opencv-python-headless"
version = "5.0.0.93"
modules = []

[[environment.packages]]
name = "pandas"
version = "3.0.6"
modules = ["pandas"]

[[environment.packages]]
name = "pillow"
version = "12.3.0"
modules = ["PIL"]

[[environment.packages]]
name = "scikit-image"
version = "0.26.0"
modules = ["skimage"]

[[environment.packages]]
name = "scikit-learn"
version = "1.9.1"
modules = ["sklearn"]

[[environment.packages]]
name = "scipy"
version = "1.18.1"
modules = []

