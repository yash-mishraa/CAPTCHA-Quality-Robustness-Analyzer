# Milestone M8A frozen execution protocol for the planned cross-font
# generalization benchmark.
#
# This protocol is a frozen, reviewed specification of what the execution
# milestone (M8B) is allowed to create and how it must behave. M8A itself
# generates nothing: no images, no text cases, no dataset rows, no
# predictions, no model artifacts. The protocol is deliberately
# implementation-free where an exact detail could not be established from
# committed artifacts; those items are listed under [unresolved] and the
# lifecycle verifier fails closed while any of them remains open.
#
# The scientific design is the M7D plan verbatim: ten typefaces (three
# familiar, seven held-out), thirty matched text cases per typeface, 300
# source cases, 6,300 rows (5,700 primary, 600 diagnostic), the M7B
# corruption ladder and diagnostic exclusions, the frozen renderer at
# 192x64 8-bit grayscale PNG, and zero-shot evaluation of the frozen M5C
# champion. The target stays synthetic-reference SSIM; PSNR stays
# diagnostic only.

[run]
name = "cross-font-benchmark"
version = "v0.1.0"
milestone = "M8B"
status = "frozen_not_executed"
seed = 20260821

[scope]
question = "How does the frozen M5C champion predict synthetic-reference SSIM across a pre-specified roster of ten typefaces when the text case and the corruption realisation are matched across fonts?"
design_source = "M7D plan (configs/evaluation_design_plan_v0_1_0.toml, SHA-256 e9f236b383172217e85096c1e06e81adcbb3fd85dc5c18f6537d824e1c6300d3)"
design_contract = "The design below is the M7D plan verbatim. This protocol freezes the execution details the M7D plan left open; it may not change the roster, the case count, the row counts, the corruption ladder, the renderer specification, the diagnostic exclusions, the model or the target."
evaluation_mode = "zero-shot: the frozen M5C champion predicts the new benchmark; no model is trained, fine-tuned, recalibrated, selected or re-fitted, and no feature is added, removed or reordered."
comparison_baseline = "The familiar-font M5C test-slice metrics already recorded in reports/retention_aware_selection_v0_1_0/test_slice_metrics.csv are the only baseline. They are read, never recomputed, and no selection or refitting is performed on the new evaluation results."

[roster]
source = "M7D planned_fonts, cross-checked against M7E protocol v0.2.0"
n_fonts = 10
n_familiar = 3
n_held_out = 7
note = "Georgia, Monaco and Impact were already evaluated in M7B. They remain valid held-out identities because the champion was never fitted, calibrated or selected on them, but they are not fonts that are new to the project evaluation, and a result on them is not an independent replication of the M7B three-font finding."
limitation = "Seven held-out font identities are the key limitation for any font-population generalisation claim. The 300 source cases are not 300 independent font identities: they are ten font identities observed over thirty matched text cases."

[font_groups.familiar]
label = "m3_development_fonts"
members = ["arial", "courier_new", "times_new_roman"]
n_fonts = 3

[font_groups.m7b_held_out]
