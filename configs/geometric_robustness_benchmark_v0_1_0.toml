# Milestone 5B grouped geometric-robustness benchmark.
#
# This file is separate from the frozen Milestone 2 dataset, the Milestone 3
# benchmark, the M4A/M4B occlusion-interference work and the M5A geometric
# pilot. It pins the exact inputs and declares the model grid and severity
# protocol before any test-source prediction is made.
#
# Scope: synthetic image similarity (SSIM against the clean reference), not
# human readability, CAPTCHA solvability, security or real-world generalisation.

[run]
name = "geometric-distortion-robustness-benchmark"
version = "v0.1.0"
seed = 20261024
n_bootstrap = 1000
selection_metric = "rmse"
output_reports = "reports/geometric_robustness_benchmark_v0_1_0"
output_models = "models/geometric_robustness_benchmark_v0_1_0"

[schema]
feature_set_version = "v1"
target = "ssim_target"
feature_names = [
  "intensity_mean",
  "intensity_std",
  "contrast_rms",
  "ink_fraction",
  "laplacian_variance",
  "edge_density",
  "histogram_entropy",
  "noise_sigma_immerkaer",
]
split_names = ["train", "val", "test"]

# Frozen Milestone 2 inputs. These files are never modified by this benchmark.
[m3]
dataset = "data/processed/captcha_quality_v0.1.0"
config = "configs/dataset_v0_1_0.toml"
dataset_version = "v0.1.0"
generation_config_hash = "820cce7a77b5e95761f033b75e8cb2b304b6ad6293f67b5bc27bcf0823a6cef9"
manifest_sha256 = "a6a2cb8654eb51055e11e4aec6dbc94c2a59a6fdf8ba6b4946135bffc8b4cf37"
sources_sha256 = "07d50255cdc82ea77087fc64b398d62db49f96156eea9cf5aee59bc070ab5a37"
features_sha256 = "d3715e7975cf41c41e49fa2338ca4e961a7a59981318be19149c78e89804d798"
ground_truth_sha256 = "7a09a01a802f104b86cf69ce686a176c1cf3c98b6369c7e4578d870e4f768eea"
summary_sha256 = "3f03e10e94c19de2747b3ae355b32fa044de658cf1bc8ad0e90f8f57e9a96787"
split_assignment_sha256 = "70c07d171d2e2b3032db86ce8c2942f1ca5dd1c3c01bbcd30a0fac0d7dda7232"

# The M5A dataset is reused exactly as generated. Its clean and control rows
# duplicate or near-duplicate the M3 clean references and are excluded from all
# fit/selection frames. The 0.5 px rung is diagnostic only.
[m5a]
dataset = "data/processed/geometric_distortion_pilot_v0.1.0"
config = "configs/geometric_distortion_pilot_v0_1_0.toml"
dataset_version = "v0.1.0"
config_sha256 = "00b8c5caad610fb4aaf159bb8c99e329ad217aeff6450e7cd3e566387e9f0a97"
pilot_config_hash = "e5901ce89fda1854d606aa41b6258222aa77e9bde061c9082971d7660a924c2a"
manifest_sha256 = "c63be1088db591181f23fa306f955b3ba16fe80ffb2000c4a5e3db7656fa3806"
sources_sha256 = "b565aed1f3d84d7d9c2685e8145868208d77c24b831a1f8c205778e2196a7ed0"
features_sha256 = "cb82ae60d8749f21d9d5f6dd324cd075e907544aa54bcdb62bbcab988472bb65"
summary_sha256 = "abaa11f1e20a3ffe65758a8144f71530045474dbd1984f5c67b88edf41989f2f"
image_pixel_hash_set = "33d14063be82a33cd6518b8fd79c4a78838f601b859b2eede56de36b2a33264b"
n_samples = 480
n_sources = 60
gate_verdict = "CONDITIONAL PASS"

# The frozen M3 primary model is loaded through the existing verification path.
[model]
model_dir = "models/benchmark_v0_1_0"
model_stem = "primary_model"
card_sha256 = "26d89292a59964846acf3e8bab4b84a2bf41b17863608c620c35d75975ecca73"
artifact_sha256 = "d727bdd48b1511c2e8e59a072bf43868c5dd997d71e6a884aa505c7b275fa085"

# Small predeclared conventional grid. Selection uses expanded validation
# sources only; test sources are not passed to the fit or selector.
[grid]
include_ols = true

[grid.ridge]
alphas = [0.01, 0.1, 1.0]

[grid.random_forest]
n_estimators = 300
max_depths = [8, 0]
min_samples_leafs = [1, 3]

[grid.hist_gradient_boosting]
max_iter = 200
learning_rates = [0.05, 0.1]
max_leaf_nodes = [15, 31]
min_samples_leaf = 10
l2_regularization = 0.0

# The main geometric score uses 1.0, 2.0 and 3.0 px. The 0.5 px rung is
# evaluated separately because the M5A gate found its between-source SD below
# the predeclared minimum-variation margin. Clean and control rows never enter
# any fit frame.
[protocol]
primary_amplitudes_px = [1.0, 2.0, 3.0]
diagnostic_amplitudes_px = [0.5]
primary_severities = [2, 3, 4]
diagnostic_severities = [1]
exclude_control_rows_from_fit = true
