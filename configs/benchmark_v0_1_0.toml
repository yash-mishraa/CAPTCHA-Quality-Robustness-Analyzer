# Milestone 3 benchmark configuration: conventional models for the SSIM target.
#
# This file does not modify the frozen dataset or its split. It declares the
# candidate grids, the grouped-bootstrap count, the coverage bins and the
# held-out font BEFORE any model is fitted. Test rows are used once, after model
# selection, and never for tuning.
#
# Scope: synthetic image similarity to a clean reference. Nothing here measures
# human readability or CAPTCHA solvability.

[benchmark]
name = "conventional_ssim_benchmark"
version = "v0.1.0"
seed = 20261022

# Selected a priori because it is the only serif face in the configured
# three-font set, so its glyph shapes and stroke contrast differ most from the
# two sans-serif faces. The choice uses font metadata only and predates fitting.
held_out_font = "times_new_roman"
held_out_font_reason = "Only serif face in the three-font configuration; chosen from font metadata before any fitting, with no reference to model performance."

# Grouped bootstrap replicates over source groups, not individual variants.
n_bootstrap = 1000

# Training-quantile edges for ink-coverage strata; test values never set edges.
coverage_quantiles = [0.0, 0.25, 0.5, 0.75, 1.0]

# Lowest validation RMSE wins; test is not consulted.
selection_metric = "rmse"

# A >=5% test-RMSE reduction over the naive mean is called "material" in the
# report. This is a reporting rule, not a significance test.
material_improvement_fraction = 0.05

output_dir = "reports/benchmark_v0_1_0"
model_dir = "models/benchmark_v0_1_0"

[ridge]
alphas = [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]

[random_forest]
n_estimators = 300
# 0 means unlimited depth. 4 x 3 = 12 candidates.
max_depths = [4, 6, 8, 0]
min_samples_leafs = [1, 3, 5]

[hist_gradient_boosting]
max_iter = 200
# 2 x 2 = 4 candidates with the fixed settings below.
learning_rates = [0.05, 0.1]
max_leaf_nodes = [15, 31]
min_samples_leaf = 10
l2_regularization = 0.0
