# Milestone M6B spatial resolution study.
#
# This file is separate from the frozen Milestone 2 dataset, the Milestone 3
# benchmark, the M4A/M4B occlusion-interference work, the M5A geometric pilot,
# the M5B grouped geometric-robustness benchmark, the M5C retention-aware
# selection study, the M5D retention-aware training study and the M6A
# spatial-aware feature study. It pins the exact inputs and declares the grid
# resolutions, the candidate representations, the model settings and the
# eligibility constraints and selection score before any test-source prediction
# is made.
#
# Scope: synthetic image similarity (SSIM against the clean reference), not
# human readability, CAPTCHA solvability, security or real-world generalisation.

[run]
name = "spatial-resolution-study"
version = "v0.1.0"
seed = 20261024
n_bootstrap = 1000
output_reports = "reports/spatial_resolution_study_v0_1_0"
output_models = "models/spatial_resolution_study_v0_1_0"

[schema]
# The frozen global feature schema is unchanged and is recorded here so the
# study can prove the global pipeline was not altered.
global_feature_set_version = "v1"
global_feature_names = [
  "intensity_mean",
  "intensity_std",
  "contrast_rms",
  "ink_fraction",
  "laplacian_variance",
  "edge_density",
  "histogram_entropy",
  "noise_sigma_immerkaer",
]
target = "ssim_target"
split_names = ["train", "val", "test"]

# The upstream M5C study is the frozen input. M6B reuses its pinned M3/M5A
# hashes, its source-grouped split and its verified frames verbatim by loading
# the M5C configuration, so all milestones operate on identical data. The M5C
# champion bundle is the primary baseline and is loaded without refitting.
[m5c]
config = "configs/retention_aware_selection_v0_1_0.toml"
config_sha256 = "48f3f148121537ea53a685bda961f01e758e5ac196b89b9e0181587d545086eb"
protocol_hash = "048b6d990749ca27358ce4c0d0ccb9a91cc0400e1da89ea48bea6661465e3e1a"
champion_dir = "models/retention_aware_selection_v0_1_0"
champion_stem = "selected_policy"
champion_artifact_sha256 = "c9b1625de3bb503f22fa14f9b6468b028e609b6c7febe7c307dafd0e3e1156e0"

# The M6A spatial feature implementation is the frozen upstream for the
# feature *definitions*. M6B changes only the grid resolution; the families,
# their formulas, the thresholding rule, the edge detector and the feature
# ordering are reused verbatim.
[m6a]
config = "configs/spatial_feature_study_v0_1_0.toml"
config_sha256 = "e72a9e34926573b959959b8e62956cb6070a5c4564c05357d1e1d6b65266e909"
protocol_hash = "d744248e0ebde54f83a005e05dd1a37bfdaa297a34e8d9f1299514e613e89bc9"
feature_set_version = "spatial-v1"

# The model family is fixed to the M5C champion's random forest, with the same
# settings the M6A protocol used, so that the only thing that varies between
# candidates is the input representation and its resolution. No hyperparameter
# is changed to accommodate an individual resolution. These settings are
# verified at run time against the M5B grid specification.
[model]
family = "random_forest"
n_estimators = 300
max_depth = 0
min_samples_leaf = 1
seed = 798117391

# Severity protocol, carried forward unchanged from M5B through M6A. The 0.5 px
# rung stays diagnostic only: it never enters fitting, selection or the primary
# score.
[protocol]
primary_amplitudes_px = [1.0, 2.0, 3.0]
diagnostic_amplitudes_px = [0.5]
primary_severities = [2, 3, 4]
diagnostic_severities = [1]

# ---------------------------------------------------------------------------
# Resolution study.
#
# The two M6A feature families are reused without any change to their
# mathematical definitions:
#
#   ink_occupancy - the fraction of pixels at or below the Otsu threshold of
#       the whole image, counted within the cell. The threshold is computed
#       once per image, so all cell values at a given resolution share one ink
#       definition.
#
#   edge_density - the fraction of Canny-marked pixels within the cell, using
#       the repository's existing edge convention (sigma=1.0,
#       low_threshold=0.1, high_threshold=0.2 on the image scaled to [0, 1]).
#       The edge map is computed once per image.
#
# The canonical 192x64 canvas is divided into a fixed r x c grid of cells,
# visited in row-major order. Cell bounds are the integer-division boundaries
# floor(i*height/r) .. floor((i+1)*height/r), which divides the canonical
# canvas evenly at every declared resolution and distributes any remainder to
# the later cells. A cell that would be empty yields zero for every feature
# rather than an undefined value, and an exactly uniform image has no
# distinguishable ink class and no edges, so all its features are zero.
#
# For an r x c grid each family produces r*c features, so the spatial-only
# representation has 2*r*c features and the global-plus-spatial representation
# has 8 + 2*r*c. The 8x8 grid therefore produces 128 spatial and 136 combined
# features against 432 training rows, which is why the redundancy and
# training-versus-validation diagnostics below are reported for every
# resolution. Because the forest considers all features at each split
# (max_features=1.0), a larger feature set dilutes the split search directly;
# that is measured, not tuned away.
# ---------------------------------------------------------------------------
[resolutions]
grids = [
  { rows = 2, cols = 2 },
  { rows = 4, cols = 2 },
  { rows = 4, cols = 4 },
  { rows = 8, cols = 8 },
]
edge_sigma = 1.0
edge_low_threshold = 0.1
edge_high_threshold = 0.2

# The two representations compared at every resolution.
[representations]
names = ["spatial_only", "combined"]

# The frozen champion is a separate reference, never refitted.
[champion]
name = "global_baseline"
feature_set = "global"
refit = false

# ---------------------------------------------------------------------------
# Validation-only selection.
#
# The rule is the M6A rule unchanged, with the same coefficients and the same
# tolerances, so the two studies are directly comparable. The champion is the
# reference: rmse_ref is the champion's validation RMSE on the same slice. A
# candidate qualifies only if every retention constraint holds on validation:
#
#   clean RMSE     <= champion clean RMSE    * (1 + tolerance_clean)
#   original RMSE  <= champion original RMSE * (1 + tolerance_original)
#   each primary geometric severity s:
#       RMSE_s      <= champion RMSE_s       * (1 + tolerance_severity)
#
# The per-severity constraint is what stops an aggregate geometric gain from
# concealing a severe regression on a single rung.
#
# Among the qualifying candidates the score is
#
#   score = w_geometric * (rmse_geo   - rmse_geo_ref)
#         + w_clean     * max(0, rmse_clean - rmse_clean_ref)
#         + w_original  * max(0, rmse_orig  - rmse_orig_ref)
#         + w_severity   * sum_s max(0, rmse_s - rmse_s_ref)
#
# Lower is better and the champion scores exactly 0. Geometric improvement is
# rewarded; clean and original-task regressions are charged at twice the rate
# per SSIM unit, because those slices are the incumbent's defining behaviour,
# and a per-severity excess is charged again. Ties are broken by lower
# aggregate geometric RMSE, then by candidate name, so the choice is
# deterministic. If no candidate qualifies, the frozen M5C champion is kept.
#
# The coefficients are round numbers fixed a priori and are identical to the
# M6A and M5D rules; none was chosen by inspecting a test result. The 4x2
# grid is a reference condition, not a reason to favour or reject that
# resolution in advance.
# ---------------------------------------------------------------------------
[selection]
rule = "retention_gated_rmse_delta"
w_geometric = 1.0
w_clean = 2.0
w_original = 2.0
w_severity = 1.0
tolerance_clean = 0.50
tolerance_original = 0.10
tolerance_severity = 0.25
