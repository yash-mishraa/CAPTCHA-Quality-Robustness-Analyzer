[[eligibility_decision]]
font_key = "luminari"
status = "review_required"
reason = "The face is available on the audit machine with the M7D-pinned SHA-256 and is shipped by Apple as a macOS system font, but the licence position for the intended use is not resolved by the recorded evidence. The macOS product licence grants use of the bundled font to display and print content and does not state whether the rendered output may be redistributed. The foundry terms that do cover the rendered output, the Canada Type Desktop & Print licence, permit static images in png, jpeg and gif formats but only take effect once Canada Type has received full payment, and they require the licensee to inform anyone with access of the terms. Whether redistribution of the rendered benchmark images under the macOS-bundled copy needs a purchased Canada Type licence is therefore unresolved, and permission is not inferred."
conditions = "Must be resolved before the face is used in the benchmark: either a written determination that the macOS product licence covers redistribution of the rendered output, or a purchased Canada Type Desktop & Print licence covering the intended use."
unresolved_questions = "Does redistribution of rendered synthetic benchmark images made with the macOS-bundled Luminari require a purchased Canada Type licence, and does the inform-others obligation in section 14 of that EULA apply to the distributed images?"
