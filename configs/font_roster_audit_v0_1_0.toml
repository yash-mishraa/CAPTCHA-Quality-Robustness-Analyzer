[[eligibility_decision]]
font_key = "arial"
status = "eligible"
reason = "Available on the audit machine with the M7D-pinned SHA-256. The macOS product licence permits using the bundled font to display and print content, and the foundry terms for the same design expressly permit distributing materials made with the font, provided no font is embedded and no per-glyph bitmap font is produced. The benchmark satisfies both conditions. The font file is not redistributed and no attribution condition applies."
conditions = "Any re-pinning of this face to a copy licensed directly from Monotype would import Monotype's artificial-intelligence training restriction on rendered glyphs and would require a fresh licence review before any training on font-rendered data."
unresolved_questions = "None blocking the intended evaluation-only workflow."

