# Milestone M7E font-roster licensing and availability audit.
#
# This is a read-only audit of the ten typefaces proposed by the M7D plan for the
# planned cross-font generalization benchmark. It records availability and licence
# evidence and derives an eligibility decision for each face. It generates no
# images, no text cases, no dataset rows, no predictions and no model artifacts, and
# it does not change the M7D plan, the M5C champion or any historical output.
#
# Evidence facts and eligibility decisions are kept in separate tables so that the
# decisions are re-derived from the recorded evidence on every verification run.
# Expected hashes are never regenerated from the current tree.

[run]
name = "font-roster-audit"
version = "v0.1.0"
seed = 20261021
output_reports = "reports/font_roster_audit_v0_1_0"

[audit]
milestone = "M7E"
status = "completed"
scope = "Availability and licence eligibility of the ten typefaces proposed by the M7D plan for the planned matched cross-font benchmark."
intended_use = "Render synthetic CAPTCHA-style text strings into 192x64 8-bit grayscale PNG images with the frozen renderer, distribute the rendered images and derived tables as a Git-ignored benchmark dataset, and evaluate the frozen M5C champion zero-shot. No model is trained on the new data."
target = "synthetic SSIM against an exact source-specific clean reference; not human readability, CAPTCHA solvability, security or production robustness"
font_file_redistribution_required = false
font_file_redistribution_rationale = "The planned benchmark never copies a font binary into the repository, the dataset or the report. The dataset manifest records the font identifier and the font SHA-256, never the font file, and the repository ignores data/, models/ and reports/. Distribution of the rendered images is therefore the only redistribution the workflow performs."
out_of_scope = "Font downloading, font conversion, font subsetting, font embedding, model training on font-rendered data, and any redistribution of font binaries are outside this audit and outside the planned benchmark."

[roster]
source = "configs/evaluation_design_plan_v0_1_0.toml"
expected_count = 10
expected_familiar = ["arial", "courier_new", "times_new_roman"]
expected_held_out = ["georgia", "monaco", "impact", "verdana", "trebuchet_ms", "chalkduster", "luminari"]
project_statuses = ["m3_development_font", "m7b_held_out_evaluation_font", "new_to_project_evaluation"]
note = "Georgia, Monaco and Impact were already evaluated in M7B. They remain valid held-out identities because the champion was never fitted, calibrated or selected on them, but they are not fonts that are new to the project evaluation and they do not constitute an independent replication of the M7B three-font result."

[statuses.eligible]
meaning = "The exact face was verified present with the pinned SHA-256, the recorded licence evidence supports using the font to render the intended output and permits distributing that output, no attribution or notice condition is unresolved, the font file is not redistributed, and the face and version are pinned reproducibly."
[statuses.ineligible]
meaning = "The recorded evidence shows a positive prohibition on the intended use, so the face may not be used in the benchmark as specified."
[statuses.review_required]
meaning = "The face is available, but the licence position for the intended use is not fully established by the recorded evidence, or a condition such as attribution, a purchase requirement or a notice obligation remains unresolved. Permission is not inferred."
[statuses.unavailable]
meaning = "The exact face could not be obtained or verified in the audit environment, so the benchmark cannot be built with it as pinned."

[derivation]
rule_unavailable = "Derived status is unavailable when the face is not installed with the pinned SHA-256, or when the recorded evidence shows the face cannot be obtained."
rule_ineligible = "Derived status is ineligible when the recorded evidence states that rendering or redistributing the intended output is prohibited."
rule_review_required = "Derived status is review_required when any of rendering, output redistribution, font-file redistribution, attribution or reproducible pinning is unverified, when an attribution or notice condition applies, or when the font file would have to be redistributed for the intended workflow."
rule_eligible = "Derived status is eligible when the face is verified available and pinned, rendering and output redistribution are permitted, the font file is not redistributed, and no attribution or notice condition is unresolved."
rule_declared = "A declared status of eligible is only accepted when the derived status is eligible. A declared status of ineligible requires a positive prohibition in the evidence. A declared status of unavailable requires the face to be unobtainable. review_required is always accepted as the conservative default."

[[inputs]]
key = "m7d_config"
path = "configs/evaluation_design_plan_v0_1_0.toml"
sha256 = "e9f236b383172217e85096c1e06e81adcbb3fd85dc5c18f6537d824e1c6300d3"
role = "M7D planning configuration: the proposed font roster, pinned paths and pinned font hashes"

[[inputs]]
key = "m7d_plan_manifest"
path = "reports/evaluation_design_plan_v0_1_0/plan_manifest.json"
sha256 = "7eeaf58969c001142d158681d38283b718cb7a5fa7914c22af29f1c6ec48e8a8"
