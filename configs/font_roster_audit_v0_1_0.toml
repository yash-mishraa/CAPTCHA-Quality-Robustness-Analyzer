evidence_grade = "primary_authoritative"
evidence_notes = "The installed copy is governed by the macOS SLA, which contains no artificial-intelligence or machine-learning restriction. Monotype's direct licence does contain one; it would apply only to a copy licensed from Monotype, not to the macOS-bundled copy used here."

