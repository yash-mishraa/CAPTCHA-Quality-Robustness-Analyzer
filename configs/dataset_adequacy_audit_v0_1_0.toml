# Milestone M7A dataset-adequacy and evaluation audit.
#
# This is a read-only audit of the frozen Milestone 2 dataset, the M5A
# geometric-distortion pilot, the M5B grouped benchmark, the M5C champion and
# the M6A-M6D feature studies. It does not generate a dataset, train or
# recalibrate a model, change a target, change a split or add a corruption
# family. Every input below is pinned by SHA-256 and re-verified before any
# table is written.
#
# Scope: synthetic image similarity (SSIM against the exact clean reference).
# Nothing in this audit measures human readability, CAPTCHA solvability,
# security or real-world generalisation.

[run]
name = "dataset-adequacy-audit"
version = "v0.1.0"
seed = 20261108
# Source-grouped bootstrap replicates. This is a descriptive interval, not a
# significance test; the independent unit is a source group, never an image
# variant.
n_bootstrap = 2000
output_reports = "reports/dataset_adequacy_audit_v0_1_0"

[schema]
feature_set_version = "v1"
feature_names = [
  "intensity_mean",
  "intensity_std",
  "contrast_rms",
  "ink_fraction",
  "laplacian_variance",
  "edge_density",
  "histogram_entropy",
  "noise_sigma_immerkaer",
]
target = "ssim_target"
split_names = ["train", "val", "test"]
claim_schema_version = "v1"
allowed_classifications = ["supported", "suggestive", "unsupported"]

# Frozen upstream inputs. The M5C configuration is the authoritative pin for
# the M3/M5A datasets, the source-grouped split and the champion; the audit
# re-loads it through the existing verified path rather than reconstructing it.
[inputs.m3]
dataset = "data/processed/captcha_quality_v0.1.0"
config = "configs/dataset_v0_1_0.toml"
config_sha256 = "72a945af829b2b61a8f748f1712b5231254f0ef480591f10ea595d69a9ff812a"
