[audit]
group_column = "source_id"
bootstrap_method = "source_grouped_percentile"
confidence_level = 0.95
# A slice whose target standard deviation is below this margin is reported as
# near-degenerate. The value is the M5A pilot's predeclared minimum-variation
# margin, not a threshold chosen after seeing this audit.
near_degenerate_sd = 0.005
redundancy_abs_correlation = 0.90
top_k_sources = 3
min_sources_for_interval = 2
feature_slice_dimensions = ["family", "severity_level"]
bootstrap_scopes = [
  "geometric_primary",
  "geometric_primary_severity_2",
  "geometric_primary_severity_3",
  "geometric_primary_severity_4",
  "clean_reference",
  "original_blur_noise",
  "original_blur_noise_gaussian_blur",
  "original_blur_noise_gaussian_noise",
  "m3_test_overall",
  "diagnostic_0_5",
]

# Counts that the audit must reproduce from the manifests. A mismatch is a
# failed input check, not something to explain away.
[expectations]
m3_sources = [36, 12, 12]
m3_samples = [324, 108, 108]
m5a_sources = [36, 12, 12]
m5a_samples = [288, 96, 96]
expanded_train_rows = 432
expanded_val_rows = 144
primary_test_rows = 36
diagnostic_test_rows = 12
m3_test_rows = 108
n_sources = 60
n_fonts = 3

# The audit compares all four predeclared next directions and recommends
# exactly one. The recommendation is not executed in this milestone.
[recommendation]
selected_direction = "B"
directions = ["A", "B", "C", "D"]
