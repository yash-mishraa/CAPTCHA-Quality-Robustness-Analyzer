# Milestone M8C benchmark output-lifecycle protocol, version 0.3.0.
#
# This protocol versions the transition between the historical M7D planning
# state and the authorised execution state of the planned cross-font
# generalization benchmark. It creates nothing. It declares exactly which
# paths a future execution milestone may create, what the pre-execution and
# post-execution verification rules are, and which frozen inputs must stay
# byte-identical across the transition.
#
# The M7D planning artifacts are immutable. M7D's own
# 'no_planned_outputs_created' check is retained and is not excluded from
# protection; the lifecycle verifier re-verifies the M7D artifacts and
# classifies the planning-state check in each state explicitly, so a later
# execution run cannot retroactively rewrite the original plan.

[run]
name = "benchmark-output-lifecycle"
version = "v0.3.0"
milestone = "M8C"
status = "executed"
seed = 20260821
supersedes = "v0.2.0"

[states]
historical = "The M7D planning state. The M7D plan configuration, plan manifest, report, run metadata, recorded snapshot and expected hashes are immutable. They are re-verified by the M7D verifier and, independently, by this lifecycle verifier."
authorized = "The current state. A future execution milestone is authorised to create exactly the paths listed under [authorized_execution], under the protocol listed there, and nothing else. The planned paths do not exist yet."
executed = "The state after the authorised execution milestone has run and produced the benchmark dataset and report. The planned paths exist with exactly the declared membership, and every frozen input is unchanged."

[historical_state]
m7d_config = "configs/evaluation_design_plan_v0_1_0.toml"
m7d_config_sha256 = "e9f236b383172217e85096c1e06e81adcbb3fd85dc5c18f6537d824e1c6300d3"
m7d_plan_manifest = "reports/evaluation_design_plan_v0_1_0/plan_manifest.json"
m7d_plan_manifest_sha256 = "7eeaf58969c001142d158681d38283b718cb7a5fa7914c22af29f1c6ec48e8a8"
m7d_report = "reports/evaluation_design_plan_v0_1_0/report.md"
m7d_report_sha256 = "bb6755f800874903cf19c7e1ad83cb856462033b801e9e2a158267d3004195c2"
m7e_v0_1_0_config = "configs/font_roster_audit_v0_1_0.toml"
m7e_v0_1_0_config_sha256 = "5c8140e4bebb4ede473fdbf6499b476afc73157a595a4a16a16be61805038755"
m7e_v0_2_0_config = "configs/font_roster_audit_v0_2_0.toml"
m7e_v0_2_0_config_sha256 = "bc319df3cae8114d6ecdcb50310a0c69c54af94cd7399c69e48189dfe0733faa"
planning_state_check = "no_planned_outputs_created"
note = "The M7D verifier continues to validate the M7D artifacts unchanged. Its planning-state check records the planning state; after the authorised execution it is expected to report the transition, and the lifecycle verifier classifies it rather than bypassing it."

[authorized_execution]
milestone = "M8B"
protocol = "configs/cross_font_benchmark_protocol_v0_2_0.toml"
protocol_sha256 = "059388572f264fb2332f3427da774f1ab30f1339a27f19fd3e98e98163d4574c"
dataset_output = "data/processed/matched_font_benchmark_v0.1.0"
report_output = "reports/matched_font_benchmark_v0_1_0"
n_sources = 300
n_rows = 6300
n_primary_rows = 5700
n_diagnostic_rows = 600
n_images = 6300
prohibition = "Only the dataset_output and report_output directories may be created, and only with the declared membership below. No font binary may be written anywhere. No other path in the repository, in the frozen milestone directories or in the shared configuration, dataset, model and report trees may be created or modified by the execution milestone."
immutability = "The execution milestone may not modify the M7D plan configuration, plan manifest, report, run metadata, recorded snapshot or expected hashes, nor the M7E audit protocols, nor any M3-M7C artifact. The lifecycle verifier re-hashes all of them in both states."

[[authorized_dataset_files]]
name = "manifest.csv"
role = "one row per benchmark row: sample, source, font, case, variant, image and reference hashes, target"

[[authorized_dataset_files]]
name = "sources.csv"
role = "one row per source: source, case, font, text length, text hash, render seed, split"

[[authorized_dataset_files]]
name = "source_cases.csv"
role = "one row per source and case: the matched-case manifest, with the per-case text hash"

[[authorized_dataset_files]]
name = "ground_truth.csv"
role = "the literal text strings; Git-ignored, never committed"

[[authorized_dataset_files]]
name = "features.csv"
role = "the eight frozen features per row"

[[authorized_dataset_files]]
name = "dataset_summary.json"
role = "counts, hashes, config identity and the generation parameters"

[[authorized_dataset_directories]]
name = "images"
role = "the rendered PNG images, one per benchmark row"
required_image_count = 6300
subdirectories = ["clean", "gaussian_blur", "gaussian_noise", "thin_lines", "arc_strokes", "elastic"]

[[authorized_report_files]]
name = "predictions.csv"
role = "the frozen champion's prediction per row"

[[authorized_report_files]]
name = "overall_metrics.csv"
role = "primary overall MAE, RMSE and R2"

[[authorized_report_files]]
name = "font_metrics.csv"
role = "primary metrics per font"

[[authorized_report_files]]
name = "family_metrics.csv"
role = "primary metrics per corruption family"

[[authorized_report_files]]
name = "severity_metrics.csv"
role = "primary metrics per corruption severity"

[[authorized_report_files]]
name = "group_metrics.csv"
role = "primary metrics per font group: familiar, M7B held-out, new held-out"

[[authorized_report_files]]
name = "source_metrics.csv"
role = "per-source aggregates"

[[authorized_report_files]]
name = "target_distributions.csv"
role = "per-scope target distributions and near-degeneracy flags"

[[authorized_report_files]]
name = "uncertainty.csv"
role = "source-grouped and matched-case bootstrap intervals"

[[authorized_report_files]]
name = "comparison.csv"
role = "the recorded familiar-font baseline beside the new results"

[[authorized_report_files]]
name = "dataset_composition.csv"
role = "the realised composition, checked against the protocol"

[[authorized_report_files]]
name = "isolation_checks.csv"
role = "the execution milestone's own integrity checks"

[[authorized_report_files]]
name = "input_manifest.csv"
role = "the pinned inputs the execution milestone used"

[[authorized_report_files]]
name = "report.md"
role = "the human-readable benchmark report"

[[authorized_report_files]]
name = "run_metadata.json"
role = "the execution metadata, including the runtime-only field"

[verification_rules]
pre_execution = "The authorised dataset and report paths do not exist. Every pinned input matches its recorded SHA-256, including the M7D plan artifacts, the M7E audit protocols, the M5C champion artifact and card, and the pinned source files of the rendering, corruption, feature and inference code. The M7D and M7E verifiers pass, including the M7D planning-state check. The roster in the execution protocol matches the M7D planned fonts and the M7E version 0.2.0 evidence, font key by font key and hash by hash. No font binary exists anywhere in the working tree. The M7D plan, report, manifest, run metadata, recorded snapshot and expected hashes are byte-identical to their recorded values."
post_execution = "The authorised dataset and report paths exist. The dataset directory contains exactly the declared top-level files and an images directory with exactly the declared image count. The report directory contains exactly the declared files. Every pinned input is still byte-identical, so the execution run did not rewrite the M7D plan or any frozen artifact. The realised dataset matches the protocol: the ten fonts and their hashes, the thirty matched cases, the 300 sources, the 6,300 rows, the 5,700 primary and 600 diagnostic rows, and the source-grouped split membership. No font binary exists anywhere in the working tree. The M7D planning-state check is expected to report the transition; the lifecycle verifier classifies it and requires that no other M7D check fails."
fail_closed = "Any missing or unexpected member, any altered frozen input, any unapproved roster change, any tamper with the recorded snapshot, any model artifact or feature-schema change, and any unresolved protocol item fails the verification. No expected hash is ever regenerated from the current tree."

[changelog]
version = "v0.2.0"
supersedes = "v0.1.0"
summary = "Version 0.3.0 records the executed state after Milestone M8C generated the authorised matched cross-font benchmark. It supersedes version 0.2.0 without modifying it. The historical M7D state, the authorised paths, their exact membership, the execution protocol, and the pre- and post-execution verification rules are unchanged. The M8C execution module is added as a declared input so the executed state pins the code that produced the outputs. Version 0.2.0 remains byte-for-byte unchanged as the record of the authorised-but-not-executed state."

[membership]
note = "The dependency membership is file-exact: only the files listed above are hashed. An unrelated configuration, dataset, model or report added to a shared directory later does not invalidate this verification, while a modified or deleted declared input does. No whole growing directory is fingerprinted, and no expected hash is generated from a current output."

