[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "captcha-quality-analyzer"
dynamic = ["version"]
description = "A reproducible pipeline for generating synthetic CAPTCHA-style text images and analyzing their image quality and robustness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Yash Mishra" }]
keywords = [
  "captcha",
  "computer-vision",
  "image-quality-assessment",
  "robustness",
  "synthetic-data",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pillow>=10.2",
]

[project.optional-dependencies]
# Image-quality metrics and handcrafted features (Milestones 1-2).
image = [
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
  # Exact glyph-coverage evidence for the Milestone 8 source-case manifest.
  "fonttools>=4.50",
]
# Conventional baselines (Milestone 3); the CNN extra remains separate.
ml = [
  "joblib>=1.3",
  "scikit-learn>=1.4",
]
deep-learning = [
  "torch>=2.2",
]
# Planned for Milestone 6 (interactive dashboard).
app = [
  "streamlit>=1.32",
]
# Needed to develop, lint, and test this repository.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/yash-mishraa/CAPTCHA-Quality-Robustness-Analyzer"

[project.scripts]
captcha-pilot = "captcha_quality.pilot:main"
captcha-dataset = "captcha_quality.cli:main"
captcha-benchmark = "captcha_quality.benchmark:main"
captcha-robustness-pilot = "captcha_quality.robustness_pilot:main"
captcha-robustness-benchmark = "captcha_quality.robustness_benchmark:main"
captcha-geometric-pilot = "captcha_quality.geometric_pilot:main"
captcha-geometric-benchmark = "captcha_quality.geometric_benchmark:main"
captcha-retention-aware = "captcha_quality.retention_aware:main"
captcha-retention-training = "captcha_quality.retention_aware_training:main"
captcha-spatial-study = "captcha_quality.spatial_study:main"
captcha-resolution-study = "captcha_quality.spatial_resolution_study:main"
captcha-local-structure-study = "captcha_quality.local_structure_study:main"
captcha-structure-tensor-study = "captcha_quality.structure_tensor_study:main"
captcha-dataset-audit = "captcha_quality.dataset_audit:main"
captcha-heldout-font-benchmark = "captcha_quality.heldout_font_benchmark:main"
captcha-cross-font-analysis = "captcha_quality.cross_font_analysis:main"
captcha-evaluation-plan = "captcha_quality.evaluation_plan:main"
captcha-font-roster-audit = "captcha_quality.font_roster_audit:main"
captcha-benchmark-lifecycle = "captcha_quality.benchmark_lifecycle:main"
captcha-benchmark-preflight = "captcha_quality.benchmark_preflight:main"
captcha-matched-font-benchmark = "captcha_quality.matched_font_benchmark:main"

[tool.hatch.version]
path = "src/captcha_quality/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_quality"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "slow: tests that take noticeably longer than the default suite",
]

[tool.coverage.run]
source = ["src/captcha_quality"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line length is enforced by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["captcha_quality"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
