<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570" role="img" aria-labelledby="title desc">
<title id="title">Interference severity target and prediction</title>
<desc id="desc">Line chart of mean target and mean prediction across thin-line and arc-stroke severities. Predictions remain near 0.90 while targets fall at severe rungs.</desc>
<rect x="0.00" y="0.00" width="980.00" height="570.00" rx="0.00" fill="#ffffff" stroke="none" stroke-width="1.00"/>
<text x="34.00" y="34.00" font-family="Helvetica, Arial, sans-serif" font-size="20.00" fill="#1f2937" text-anchor="start" font-weight="bold">Interference severity: target vs prediction</text><text x="34.00" y="56.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#6b7280" text-anchor="start" font-weight="normal">Mean SSIM at each predeclared severity rung; one row per source group per rung.</text><line x1="90.00" y1="405.00" x2="930.00" y2="405.00" stroke="#d1d5db" stroke-width="0.80" stroke-dasharray="4 4"/><text x="78.00" y="409.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="end" font-weight="normal">0.7</text><line x1="90.00" y1="296.67" x2="930.00" y2="296.67" stroke="#d1d5db" stroke-width="0.80" stroke-dasharray="4 4"/><text x="78.00" y="300.67" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="end" font-weight="normal">0.8</text><line x1="90.00" y1="188.33" x2="930.00" y2="188.33" stroke="#d1d5db" stroke-width="0.80" stroke-dasharray="4 4"/><text x="78.00" y="192.33" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="end" font-weight="normal">0.9</text><line x1="90.00" y1="80.00" x2="930.00" y2="80.00" stroke="#d1d5db" stroke-width="0.80" stroke-dasharray="4 4"/><text x="78.00" y="84.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="end" font-weight="normal">1.0</text><line x1="90.00" y1="80.00" x2="90.00" y2="470.00" stroke="#d1d5db" stroke-width="0.80" stroke-dasharray="4 4"/><text x="90.00" y="494.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="middle" font-weight="normal">s1</text><line x1="370.00" y1="80.00" x2="370.00" y2="470.00" stroke="#d1d5db" stroke-width="0.80" stroke-dasharray="4 4"/><text x="370.00" y="494.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="middle" font-weight="normal">s2</text><line x1="650.00" y1="80.00" x2="650.00" y2="470.00" stroke="#d1d5db" stroke-width="0.80" stroke-dasharray="4 4"/><text x="650.00" y="494.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="middle" font-weight="normal">s3</text><line x1="930.00" y1="80.00" x2="930.00" y2="470.00" stroke="#d1d5db" stroke-width="0.80" stroke-dasharray="4 4"/><text x="930.00" y="494.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="middle" font-weight="normal">s4</text><text x="510.00" y="544.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="middle" font-weight="normal">Severity level</text><text x="26.00" y="275.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="middle" font-weight="normal" transform="rotate(-90 26.00 275.00)">Mean SSIM</text><polyline points="90.00,139.34 370.00,196.28 650.00,292.46 930.00,408.83" fill="none" stroke="#dc2626" stroke-width="2.60"/><polyline points="90.00,109.63 370.00,142.38 650.00,179.01 930.00,183.85" fill="none" stroke="#dc2626" stroke-width="2.60" stroke-dasharray="7 5"/><circle cx="90.00" cy="139.34" r="4.20" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><circle cx="370.00" cy="196.28" r="4.20" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><circle cx="650.00" cy="292.46" r="4.20" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><circle cx="930.00" cy="408.83" r="4.20" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><circle cx="90.00" cy="109.63" r="4.20" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><circle cx="370.00" cy="142.38" r="4.20" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><circle cx="650.00" cy="179.01" r="4.20" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><circle cx="930.00" cy="183.85" r="4.20" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><text x="800.00" y="90.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#dc2626" text-anchor="start" font-weight="bold">Thin lines</text><polyline points="90.00,128.21 370.00,175.13 650.00,255.31 930.00,360.33" fill="none" stroke="#1d4ed8" stroke-width="2.60"/><polyline points="90.00,100.36 370.00,130.17 650.00,172.69 930.00,182.23" fill="none" stroke="#1d4ed8" stroke-width="2.60" stroke-dasharray="7 5"/><circle cx="90.00" cy="128.21" r="4.20" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><circle cx="370.00" cy="175.13" r="4.20" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><circle cx="650.00" cy="255.31" r="4.20" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><circle cx="930.00" cy="360.33" r="4.20" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><circle cx="90.00" cy="100.36" r="4.20" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><circle cx="370.00" cy="130.17" r="4.20" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><circle cx="650.00" cy="172.69" r="4.20" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><circle cx="930.00" cy="182.23" r="4.20" fill="#1d4ed8" stroke="#ffffff" stroke-width="1"/><text x="800.00" y="110.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1d4ed8" text-anchor="start" font-weight="bold">Arc strokes</text><text x="800.00" y="134.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="start" font-weight="normal">solid = target</text><text x="800.00" y="150.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="start" font-weight="normal">dashed = prediction</text><text x="34.00" y="512.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="start" font-weight="normal">At s4 the mean prediction is near 0.90 while the mean thin-line target is 0.70 and the mean arc target is 0.74. The gap is a descriptive calibration failure, not a causal test.</text>
</svg>
