<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">Prediction error by corruption family</title>
<desc id="desc">Horizontal bars show MAE for blur, noise, interference and geometric conditions. Interference has the largest MAE and a negative bias. Intervals are source-grouped percentile bootstrap intervals.</desc>
<rect x="0.00" y="0.00" width="1040.00" height="610.00" rx="0.00" fill="#ffffff" stroke="none" stroke-width="1.00"/>
<text x="34.00" y="34.00" font-family="Helvetica, Arial, sans-serif" font-size="20.00" fill="#1f2937" text-anchor="start" font-weight="bold">Prediction error by corruption family</text><text x="34.00" y="56.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#6b7280" text-anchor="start" font-weight="normal">MAE with a source-grouped 95% percentile interval; bias = target - prediction.</text><text x="161.00" y="96.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="end" font-weight="normal">Gaussian blur</text><rect x="175.00" y="78.00" width="142.58" height="26.00" rx="3.00" fill="#2563eb" stroke="none" stroke-width="1.00"/><line x1="301.00" y1="91.00" x2="336.92" y2="91.00" stroke="#111827" stroke-width="1.30"/><line x1="301.00" y1="85.00" x2="301.00" y2="97.00" stroke="#111827" stroke-width="1.30"/><line x1="336.92" y1="85.00" x2="336.92" y2="97.00" stroke="#111827" stroke-width="1.30"/><text x="804.00" y="96.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="start" font-weight="normal">MAE 0.026   bias 0.007</text><text x="161.00" y="150.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="end" font-weight="normal">Gaussian noise</text><rect x="175.00" y="132.00" width="209.68" height="26.00" rx="3.00" fill="#0f766e" stroke="none" stroke-width="1.00"/><line x1="359.00" y1="145.00" x2="413.94" y2="145.00" stroke="#111827" stroke-width="1.30"/><line x1="359.00" y1="139.00" x2="359.00" y2="151.00" stroke="#111827" stroke-width="1.30"/><line x1="413.94" y1="139.00" x2="413.94" y2="151.00" stroke="#111827" stroke-width="1.30"/><text x="804.00" y="150.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="start" font-weight="normal">MAE 0.039   bias 0.026</text><text x="161.00" y="204.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="end" font-weight="normal">Interference</text><rect x="175.00" y="186.00" width="488.68" height="26.00" rx="3.00" fill="#b91c1c" stroke="none" stroke-width="1.00"/><line x1="645.18" y1="199.00" x2="680.66" y2="199.00" stroke="#111827" stroke-width="1.30"/><line x1="645.18" y1="193.00" x2="645.18" y2="205.00" stroke="#111827" stroke-width="1.30"/><line x1="680.66" y1="193.00" x2="680.66" y2="205.00" stroke="#111827" stroke-width="1.30"/><text x="804.00" y="204.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="start" font-weight="normal">MAE 0.091   bias -0.087</text><text x="161.00" y="258.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="end" font-weight="normal">Thin lines</text><rect x="175.00" y="240.00" width="549.20" height="26.00" rx="3.00" fill="#dc2626" stroke="none" stroke-width="1.00"/><line x1="702.68" y1="253.00" x2="744.44" y2="253.00" stroke="#111827" stroke-width="1.30"/><line x1="702.68" y1="247.00" x2="702.68" y2="259.00" stroke="#111827" stroke-width="1.30"/><line x1="744.44" y1="247.00" x2="744.44" y2="259.00" stroke="#111827" stroke-width="1.30"/><text x="804.00" y="258.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="start" font-weight="normal">MAE 0.102   bias -0.097</text><text x="161.00" y="312.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="end" font-weight="normal">Arc strokes</text><rect x="175.00" y="294.00" width="428.16" height="26.00" rx="3.00" fill="#1d4ed8" stroke="none" stroke-width="1.00"/><line x1="586.84" y1="307.00" x2="620.19" y2="307.00" stroke="#111827" stroke-width="1.30"/><line x1="586.84" y1="301.00" x2="586.84" y2="313.00" stroke="#111827" stroke-width="1.30"/><line x1="620.19" y1="301.00" x2="620.19" y2="313.00" stroke="#111827" stroke-width="1.30"/><text x="804.00" y="312.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="start" font-weight="normal">MAE 0.080   bias -0.077</text><text x="161.00" y="366.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="end" font-weight="normal">Geometric (primary)</text><rect x="175.00" y="348.00" width="258.36" height="26.00" rx="3.00" fill="#15803d" stroke="none" stroke-width="1.00"/><line x1="424.47" y1="361.00" x2="442.74" y2="361.00" stroke="#111827" stroke-width="1.30"/><line x1="424.47" y1="355.00" x2="424.47" y2="367.00" stroke="#111827" stroke-width="1.30"/><line x1="442.74" y1="355.00" x2="442.74" y2="367.00" stroke="#111827" stroke-width="1.30"/><text x="804.00" y="366.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="start" font-weight="normal">MAE 0.048   bias -0.009</text><text x="161.00" y="420.00" font-family="Helvetica, Arial, sans-serif" font-size="13.00" fill="#1f2937" text-anchor="end" font-weight="normal">All primary</text><rect x="175.00" y="402.00" width="320.71" height="26.00" rx="3.00" fill="#4b5563" stroke="none" stroke-width="1.00"/><line x1="488.49" y1="415.00" x2="503.04" y2="415.00" stroke="#111827" stroke-width="1.30"/><line x1="488.49" y1="409.00" x2="488.49" y2="421.00" stroke="#111827" stroke-width="1.30"/><line x1="503.04" y1="409.00" x2="503.04" y2="421.00" stroke="#111827" stroke-width="1.30"/><text x="804.00" y="420.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="start" font-weight="normal">MAE 0.060   bias -0.031</text><line x1="175.00" y1="464.00" x2="790.00" y2="464.00" stroke="#1f2937" stroke-width="1.20"/><line x1="175.00" y1="464.00" x2="175.00" y2="469.00" stroke="#1f2937" stroke-width="1.00"/><text x="175.00" y="484.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="middle" font-weight="normal">0</text><line x1="282.61" y1="464.00" x2="282.61" y2="469.00" stroke="#1f2937" stroke-width="1.00"/><text x="282.61" y="484.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="middle" font-weight="normal">0.02</text><line x1="390.22" y1="464.00" x2="390.22" y2="469.00" stroke="#1f2937" stroke-width="1.00"/><text x="390.22" y="484.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="middle" font-weight="normal">0.04</text><line x1="497.83" y1="464.00" x2="497.83" y2="469.00" stroke="#1f2937" stroke-width="1.00"/><text x="497.83" y="484.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="middle" font-weight="normal">0.06</text><line x1="605.44" y1="464.00" x2="605.44" y2="469.00" stroke="#1f2937" stroke-width="1.00"/><text x="605.44" y="484.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="middle" font-weight="normal">0.08</text><line x1="713.04" y1="464.00" x2="713.04" y2="469.00" stroke="#1f2937" stroke-width="1.00"/><text x="713.04" y="484.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="middle" font-weight="normal">0.1</text><text x="482.50" y="507.00" font-family="Helvetica, Arial, sans-serif" font-size="12.00" fill="#1f2937" text-anchor="middle" font-weight="normal">MAE (SSIM units)</text><text x="34.00" y="586.00" font-family="Helvetica, Arial, sans-serif" font-size="11.00" fill="#6b7280" text-anchor="start" font-weight="normal">Positive bias means underprediction; negative bias means overprediction. Intervals resample whole source groups, not images.</text>
</svg>
